; PortWatch — PlatformIO build (Arduino core 3.x via pioarduino)
;   pio run -e cyd        -> out/PortWatch-cyd.bin (+ .ota.bin)
;   pio run -e guition    -> out/PortWatch-guition.bin (+ .ota.bin)
; After both are built, out/PortWatch-Flasher.html has the firmware baked in (needs Python 3, which PlatformIO already has).

[platformio]
src_dir = PortWatch
default_envs = cyd, guition

[env]
platform = espressif32@6.9.0   ; Arduino core 2.0.17, the same as the GitHub build
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
lib_deps =
  moononournation/GFX Library for Arduino@1.4.9
  bblanchon/ArduinoJson@^7.2.1
  paulstoffregen/XPT2046_Touchscreen@^1.4
extra_scripts = post:tools/pio_merge.py

[env:cyd]
board = esp32dev
build_flags = -DCORE_DEBUG_LEVEL=0

[env:guition]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=0
